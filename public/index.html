<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="agentdeck-token" content="__AGENTDECK_TOKEN__">
<title>AgentDeck</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app">
  <aside id="sidebar" aria-label="Navigation">
    <div class="brand">
      <img src="favicon.svg" alt="" width="34" height="34">
      <div>
        <div class="brand-name">AgentDeck</div>
        <div class="brand-sub">One deck for every coding agent</div>
      </div>
      <button class="ghost icon" id="btn-menu" aria-label="Show navigation" aria-expanded="false">☰</button>
    </div>
    <div id="side-body">
      <button class="search" id="btn-palette" aria-label="Search and commands"><span>Search or jump to…</span><kbd>Ctrl K</kbd></button>
      <nav id="nav" aria-label="Views"></nav>
      <div id="harness-list"></div>
      <div class="sidebar-foot">
        <button class="ghost" id="btn-rescan" title="Look for harnesses and projects again">Rescan</button>
        <button class="ghost" id="btn-backups" title="Every change AgentDeck made, with undo">History</button>
        <button class="ghost icon" id="btn-theme" aria-label="Switch colour theme" title="Switch colour theme">◐</button>
      </div>
    </div>
  </aside>
  <main id="main" tabindex="-1"><div class="empty">Scanning this machine…</div></main>
</div>
<div id="modal-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
